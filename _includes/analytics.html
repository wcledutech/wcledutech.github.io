{% if page.analytics != false and site.google_analytics_id and site.google_analytics_id != '' %}

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics_id }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  var academicAnalyticsConfig = {};
  try {
    if (window.sessionStorage.getItem('academic_analytics_debug') === '1') {
      academicAnalyticsConfig.debug_mode = true;
    }
  } catch (error) {
    // Measurement remains available when browser storage is unavailable.
  }
  gtag('config', {{ site.google_analytics_id | jsonify }}, academicAnalyticsConfig);
</script>
<script defer src="{{ '/assets/js/citation-analytics.js' | relative_url }}"></script>

{% endif %}
